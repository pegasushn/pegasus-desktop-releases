server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;

    location = / {
        return 302 https://pegasus.hn/softphone;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # Update-Kanal (electron-updater, Provider generic): latest.yml je Kanal, nie lange zwischenspeichern
    location ~ ^/desktop/(stable|staging)/latest\.yml$ {
        default_type text/yaml;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Produktion: Setup, Blockmap und portable EXE -> Release v<Version>
    location ~ "^/desktop/stable/(?<file>Pegasus-Desktop-(?:Setup-)?(?<ver>\d+\.\d+\.\d+)(?:-portable)?\.exe(?:\.blockmap)?)$" {
        return 302 https://github.com/pegasushn/pegasus-desktop-releases/releases/download/v$ver/$file;
    }

    # Staging-Ausgabe (eigene App-ID) -> Release staging-v<Version>
    location ~ "^/desktop/staging/(?<file>Pegasus-Desktop-Staging-(?:Setup-)?(?<ver>\d+\.\d+\.\d+)(?:-portable)?\.exe(?:\.blockmap)?)$" {
        return 302 https://github.com/pegasushn/pegasus-desktop-releases/releases/download/staging-v$ver/$file;
    }

    location / {
        return 404;
    }
}
